name: Fix profile hover image

on:
  push:
    paths:
      - '.github/workflows/fix-hover-image.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair hover asset and path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/images
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/meterdogan07/meterdogan07.github.io/master/images/profile-mosaic-hover.jpg' -o docs/images/profile-mosaic-hover.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          s=s.replace('https://raw.githubusercontent.com/meterdogan07/meterdogan07.github.io/master/images/profile-mosaic-hover.jpg','images/profile-mosaic-hover.jpg')
          p.write_text(s)
          PY
          rm .github/workflows/fix-hover-image.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/index.html docs/images/profile-mosaic-hover.jpg .github/workflows/fix-hover-image.yml
          git commit -m 'Serve mosaic hover image from Pages'
          git push origin HEAD:master
