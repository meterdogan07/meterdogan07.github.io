name: Inspect paper source figures

on:
  push:
    paths:
      - '.github/workflows/inspect-paper-sources.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect arXiv source bundles
        shell: bash
        run: |
          set -euo pipefail
          ids=(2602.01128 2605.30638 2601.09039 2505.21077 2506.01913 2504.11558 2405.04685 2306.00563)
          for id in "${ids[@]}"; do
            echo "===== $id ====="
            mkdir -p "/tmp/src-$id"
            curl -L --fail --retry 3 -A 'Mozilla/5.0' "https://export.arxiv.org/e-print/$id" -o "/tmp/$id.src"
            file "/tmp/$id.src"
            if tar -tf "/tmp/$id.src" >/dev/null 2>&1; then
              tar -xf "/tmp/$id.src" -C "/tmp/src-$id"
            else
              cp "/tmp/$id.src" "/tmp/src-$id/source.tex"
            fi
            echo "-- figure-related TeX lines --"
            grep -RniE '\\begin\{figure|\\includegraphics|\\caption\{' "/tmp/src-$id" --include='*.tex' | head -n 120 || true
            echo "-- image-like files --"
            find "/tmp/src-$id" -type f \( -iname '*.pdf' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.eps' \) | sed "s#/tmp/src-$id/##" | head -n 120 || true
          done
