name: Localize publication figures

on:
  push:
    paths:
      - '.github/workflows/localize-paper-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick python3-pil

      - name: Download paper figures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/papers
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36'

          fetch_fig () {
            out="$1"; shift
            for url in "$@"; do
              echo "Trying $url"
              if curl -A "$UA" -L --retry 2 --fail "$url" -o "$out"; then
                return 0
              fi
            done
            echo "Could not fetch $out" >&2
            return 1
          }

          fetch_fig images/papers/tsdpo.png \
            'https://arxiv.org/html/2602.01128/x1.png' \
            'https://arxiv.org/html/2602.01128v1/x1.png'

          # SBD currently has no arXiv HTML image export. Extract its actual Figure 1
          # directly from the PDF by locating the Figure 1 caption and cropping above it.
          curl -A "$UA" -L --retry 3 --fail 'https://arxiv.org/pdf/2605.30638' -o /tmp/sbd.pdf
          pdftotext -bbox-layout /tmp/sbd.pdf /tmp/sbd.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('/tmp/sbd.xml').getroot()
          ns={'x':'http://www.w3.org/1999/xhtml'}
          pages=root.findall('.//x:page',ns)
          found=None
          for pi,page in enumerate(pages,1):
              words=page.findall('.//x:word',ns)
              texts=[(w.text or '').strip() for w in words]
              for i,t in enumerate(texts):
                  nxt=texts[i+1] if i+1<len(texts) else ''
                  if (t in ('Figure','Fig.','Fig') and nxt.lstrip('(').startswith('1')) or t.startswith('Figure1'):
                      found=(pi,float(words[i].attrib['yMin']),float(page.attrib['width']))
                      break
              if found: break
          if not found:
              raise SystemExit('Could not locate SBD Figure 1 caption')
          Path('/tmp/sbd-crop.txt').write_text(','.join(map(str,found)))
          PY
          IFS=',' read -r SBDPAGE SBDY SBDW < /tmp/sbd-crop.txt
          pdftoppm -f "$SBDPAGE" -l "$SBDPAGE" -singlefile -png -r 180 /tmp/sbd.pdf /tmp/sbd-page
          python3 - <<'PY'
          from PIL import Image,ImageChops
          page,y,width=map(float,open('/tmp/sbd-crop.txt').read().split(','))
          im=Image.open('/tmp/sbd-page.png').convert('RGB')
          scale=180/72
          x0=int(28*scale); x1=int((width-28)*scale)
          y1=int((y-4)*scale); y0=max(0,int((y-255)*scale))
          crop=im.crop((x0,y0,x1,y1))
          bg=Image.new('RGB',crop.size,'white')
          diff=ImageChops.difference(crop,bg).convert('L')
          bbox=diff.point(lambda p:255 if p>10 else 0).getbbox()
          if bbox: crop=crop.crop(bbox)
          crop.save('images/papers/sbd.png')
          PY

          fetch_fig images/papers/tokenizers.png \
            'https://arxiv.org/html/2601.09039/x1.png' \
            'https://arxiv.org/html/2601.09039v1/x1.png'

          fetch_fig images/papers/nbl.png \
            'https://arxiv.org/html/2505.21077/x1.png' \
            'https://arxiv.org/html/2505.21077v2/x1.png'

          fetch_fig images/papers/ggnc.png \
            'https://arxiv.org/html/2506.01913/x1.png' \
            'https://arxiv.org/html/2506.01913v3/x1.png'

          fetch_fig images/papers/ebd.png \
            'https://arxiv.org/html/2504.11558/x2.png' \
            'https://arxiv.org/html/2504.11558v3/x2.png'

          fetch_fig images/papers/bosphorus.png \
            'https://emrecanacikgoz.github.io/Bridging-the-Bosphorus/assets/images/case3.png' \
            'https://arxiv.org/html/2405.04685/x1.png'

          # Extract the Sensors paper's actual Fig. 2 (Kalman + ML method) from its PDF.
          curl -A "$UA" -L --retry 3 --fail 'https://arxiv.org/pdf/2306.00563' -o /tmp/nanomech.pdf
          pdftoppm -f 3 -l 3 -singlefile -png -r 180 /tmp/nanomech.pdf /tmp/nanomech-page
          pdftotext -f 3 -l 3 -bbox-layout /tmp/nanomech.pdf /tmp/nanomech.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse('/tmp/nanomech.xml').getroot(); ns={'x':'http://www.w3.org/1999/xhtml'}
          page=root.find('.//x:page',ns); words=page.findall('.//x:word',ns) if page is not None else []
          caption_y=None
          for i,w in enumerate(words[:-1]):
              if (w.text or '').strip() in ('Fig.','Fig') and (words[i+1].text or '').strip().startswith('2'):
                  caption_y=float(w.attrib['yMin']); break
          Path('/tmp/crop.txt').write_text(str(caption_y if caption_y is not None else 365.0))
          PY
          python3 - <<'PY'
          from PIL import Image,ImageChops
          capy=float(open('/tmp/crop.txt').read()); im=Image.open('/tmp/nanomech-page.png').convert('RGB'); scale=180/72
          crop=im.crop((int(35*scale),max(0,int((capy-225)*scale)),int(577*scale),int((capy-4)*scale)))
          bg=Image.new('RGB',crop.size,'white'); diff=ImageChops.difference(crop,bg).convert('L')
          bbox=diff.point(lambda p:255 if p>10 else 0).getbbox()
          if bbox: crop=crop.crop(bbox)
          crop.save('images/papers/nanomech.png')
          PY

          for f in images/papers/*.png; do
            convert "$f" -resize '1000x560>' -strip "$f"
          done

      - name: Commit localized figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- images/papers
          if git diff --cached --quiet; then
            echo 'No figure changes to commit.'
            exit 0
          fi
          git commit -m 'Add local publication figure assets'
          git push origin HEAD:master
