name: Localize publication figures

on:
  push:
    paths:
      - '.github/workflows/localize-paper-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick python3-pil
          python3 -m pip install --user pymupdf

      - name: Extract actual figures from papers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/papers
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36'

          curl -A "$UA" -L --retry 3 --fail 'https://arxiv.org/pdf/2602.01128' -o /tmp/tsdpo.pdf
          curl -A "$UA" -L --retry 3 --fail 'https://arxiv.org/pdf/2605.30638' -o /tmp/sbd.pdf
          curl -A "$UA" -L --retry 3 --fail 'https://arxiv.org/pdf/2601.09039' -o /tmp/tokenizers.pdf
          curl -A "$UA" -L --retry 3 --fail 'https://arxiv.org/pdf/2505.21077' -o /tmp/nbl.pdf
          curl -A "$UA" -L --retry 3 --fail 'https://arxiv.org/pdf/2506.01913' -o /tmp/ggnc.pdf
          curl -A "$UA" -L --retry 3 --fail 'https://arxiv.org/pdf/2504.11558' -o /tmp/ebd.pdf
          curl -A "$UA" -L --retry 3 --fail 'https://arxiv.org/pdf/2405.04685' -o /tmp/bosphorus.pdf
          curl -A "$UA" -L --retry 3 --fail 'https://arxiv.org/pdf/2306.00563' -o /tmp/nanomech.pdf

          python3 - <<'PY'
          import pymupdf as fitz
          from PIL import Image, ImageChops
          from io import BytesIO

          def extract_figure(pdf_path, out_path, figure_number=1, height_pt=250, preferred_page=None):
              doc = fitz.open(pdf_path)
              candidates = [
                  f"Figure {figure_number}", f"Figure {figure_number}:",
                  f"Fig. {figure_number}", f"Fig. {figure_number}.", f"Fig {figure_number}"
              ]
              page_order = list(range(len(doc)))
              if preferred_page is not None and 0 <= preferred_page < len(doc):
                  page_order = [preferred_page] + [i for i in page_order if i != preferred_page]
              found = None
              for pi in page_order:
                  page = doc[pi]
                  for needle in candidates:
                      rects = page.search_for(needle)
                      if rects:
                          found = (page, rects[0])
                          break
                  if found:
                      break
              if not found:
                  raise RuntimeError(f"Could not locate Figure {figure_number} in {pdf_path}")

              page, caption = found
              margin = 25
              clip = fitz.Rect(
                  margin,
                  max(0, caption.y0 - height_pt),
                  page.rect.width - margin,
                  max(1, caption.y0 - 3),
              )
              pix = page.get_pixmap(matrix=fitz.Matrix(2.5, 2.5), clip=clip, alpha=False)
              im = Image.open(BytesIO(pix.tobytes('png'))).convert('RGB')

              # Only trim white margin; never alter/replace figure contents.
              bg = Image.new('RGB', im.size, 'white')
              diff = ImageChops.difference(im, bg).convert('L')
              bbox = diff.point(lambda p: 255 if p > 10 else 0).getbbox()
              if bbox:
                  im = im.crop(bbox)
              im.thumbnail((1000, 560), Image.Resampling.LANCZOS)
              im.save(out_path, optimize=True)

          # Use each paper's lead/main figure. The Sensors paper's Fig. 2 is its
          # Kalman + ML event-prediction pipeline and is more representative than Fig. 1.
          specs = [
              ('/tmp/tsdpo.pdf',      'images/papers/tsdpo.png',      1, 260, None),
              ('/tmp/sbd.pdf',        'images/papers/sbd.png',        1, 260, None),
              ('/tmp/tokenizers.pdf', 'images/papers/tokenizers.png', 1, 260, None),
              ('/tmp/nbl.pdf',        'images/papers/nbl.png',        1, 260, None),
              ('/tmp/ggnc.pdf',       'images/papers/ggnc.png',       1, 260, None),
              ('/tmp/ebd.pdf',        'images/papers/ebd.png',        1, 260, None),
              ('/tmp/bosphorus.pdf',  'images/papers/bosphorus.png',  1, 260, None),
              ('/tmp/nanomech.pdf',   'images/papers/nanomech.png',   2, 230, 2),
          ]
          for spec in specs:
              extract_figure(*spec)
          PY

      - name: Commit localized figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- images/papers
          if git diff --cached --quiet; then
            echo 'No figure changes to commit.'
            exit 0
          fi
          git commit -m 'Add local publication figure assets'
          git push origin HEAD:master
