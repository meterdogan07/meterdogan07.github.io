name: Rebuild exact paper thumbnails

on:
  push:
    paths:
      - '.github/workflows/rebuild-paper-thumbnails.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick python3-pil
          python3 -m pip install --user pymupdf

      - name: Rebuild thumbnails from exact figure assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf images/papers-v3
          mkdir -p images/papers-v3 /tmp/papersrc
          UA='Mozilla/5.0'

          unpack_src () {
            id="$1"
            mkdir -p "/tmp/papersrc/$id"
            curl -L --fail --retry 3 -A "$UA" "https://export.arxiv.org/e-print/$id" -o "/tmp/$id.src"
            tar -xf "/tmp/$id.src" -C "/tmp/papersrc/$id"
          }
          render_pdf () {
            in="$1"; out="$2"
            pdftoppm -png -singlefile -r 200 "$in" "$out" >/dev/null 2>&1
          }

          for id in 2602.01128 2601.09039 2505.21077 2506.01913 2504.11558 2306.00563; do unpack_src "$id"; done

          # TS-DPO Figure 1: exact two source panels.
          render_pdf /tmp/papersrc/2602.01128/figs/pareto2.pdf /tmp/ts1
          render_pdf /tmp/papersrc/2602.01128/figs/pareto1.pdf /tmp/ts2
          convert /tmp/ts1.png /tmp/ts2.png +append images/papers-v3/tsdpo.png

          # Tokenizer Figure 1: exact two source panels.
          convert /tmp/papersrc/2601.09039/figures_new/scatter_plot_new.png \
                  /tmp/papersrc/2601.09039/figures_new/lang-robust-new.png \
                  +append images/papers-v3/tokenizers.png

          # NBL Figure 1: exact source vector graphic.
          render_pdf /tmp/papersrc/2505.21077/figures/fig1.pdf /tmp/nbl
          cp /tmp/nbl.png images/papers-v3/nbl.png

          # GGNC headline figure: exact two source plots.
          render_pdf /tmp/papersrc/2506.01913/figs/cifar10_unconstrained.pdf /tmp/gg1
          render_pdf /tmp/papersrc/2506.01913/figs/cifar10_dual_norm.pdf /tmp/gg2
          convert /tmp/gg1.png /tmp/gg2.png +append images/papers-v3/ggnc.png

          # EBD Figure 1: exact three source panels. Trim blank canvas only.
          convert /tmp/papersrc/2504.11558/Figures/BPYeni.png -trim +repage /tmp/ebd1.png
          convert /tmp/papersrc/2504.11558/Figures/EBDYeni.png -trim +repage /tmp/ebd2.png
          convert /tmp/papersrc/2504.11558/Figures/intro_plot_cifar_correlations_semilogy.png -trim +repage /tmp/ebd3.png
          convert /tmp/ebd1.png -resize 'x520' /tmp/ebd1r.png
          convert /tmp/ebd2.png -resize 'x520' /tmp/ebd2r.png
          convert /tmp/ebd3.png -resize 'x520' /tmp/ebd3r.png
          convert /tmp/ebd1r.png /tmp/ebd2r.png /tmp/ebd3r.png +append images/papers-v3/ebd.png

          # Sensors Figure 2: exact method diagram.
          render_pdf /tmp/papersrc/2306.00563/diagrams_kalman.pdf /tmp/nano
          cp /tmp/nano.png images/papers-v3/nanomech.png

          # SBD and Bosphorus have TeX/TikZ/PGF graphics; isolate their actual graphic objects.
          for id in 2605.30638 2405.04685; do
            curl -L --fail --retry 3 -A "$UA" "https://arxiv.org/pdf/$id" -o "/tmp/$id.pdf"
          done

          python3 - <<'PY'
          import pymupdf as fitz

          def find_caption(page, fig_no):
              for needle in (f'Figure {fig_no}:', f'Figure {fig_no}.', f'Fig. {fig_no}', f'Figure {fig_no}'):
                  hits=page.search_for(needle)
                  if hits: return hits[0]
              return None

          def graphics(page, cy):
              rects=[]
              for info in page.get_image_info(xrefs=True):
                  r=fitz.Rect(info['bbox'])
                  if r.y1<cy-1 and r.width>8 and r.height>8: rects.append(r)
              for d in page.get_drawings():
                  r=fitz.Rect(d['rect'])
                  if r.y1<cy-1 and r.width>1 and r.height>1: rects.append(r)
              return rects

          def cluster(rects, cy, pw):
              rects=[r for r in rects if r.width>pw*.12 or r.height>24] or rects
              seed=max(rects,key=lambda r:r.y1); u=fitz.Rect(seed); chosen=[seed]
              changed=True
              while changed:
                  changed=False
                  for r in rects:
                      if r in chosen: continue
                      vo=min(u.y1,r.y1)-max(u.y0,r.y0)
                      vg=max(0,max(u.y0,r.y0)-min(u.y1,r.y1))
                      hg=max(0,max(u.x0,r.x0)-min(u.x1,r.x1))
                      ho=min(u.x1,r.x1)-max(u.x0,r.x0)
                      if vo>-2 or (vg<24 and hg<pw*.12) or (ho>0 and vg<36):
                          nu=u|r
                          if cy-nu.y0<pw*1.15:
                              u=nu; chosen.append(r); changed=True
              return u

          def extract(pdf,out,fig=1):
              doc=fitz.open(pdf)
              for page in doc:
                  cap=find_caption(page,fig)
                  if not cap: continue
                  box=cluster(graphics(page,cap.y0),cap.y0,page.rect.width)
                  # Include only nearby figure labels, not body text.
                  ex=fitz.Rect(box)
                  for b in page.get_text('blocks'):
                      r=fitz.Rect(b[:4])
                      if r.y1<cap.y0-1 and r.y0>=box.y0-10 and r.y1<=box.y1+14 and r.x1>=box.x0-12 and r.x0<=box.x1+12:
                          ex|=r
                  ex.x0=max(0,ex.x0-5); ex.y0=max(0,ex.y0-5)
                  ex.x1=min(page.rect.width,ex.x1+5); ex.y1=min(cap.y0-1,ex.y1+5)
                  page.get_pixmap(matrix=fitz.Matrix(3,3),clip=ex,alpha=False).save(out)
                  print(pdf,'page',page.number+1,'box',ex)
                  return
              raise RuntimeError('figure caption not found')

          extract('/tmp/2605.30638.pdf','images/papers-v3/sbd.png')
          extract('/tmp/2405.04685.pdf','images/papers-v3/bosphorus.png')
          PY

          # Normalize only blank margins and maximum display size.
          for f in images/papers-v3/*.png; do
            convert "$f" -trim +repage -resize '1400x700>' -background white -alpha remove -strip "$f"
          done
          identify images/papers-v3/*.png

      - name: Commit rebuilt thumbnails
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- images/papers-v3
          git commit -m 'Compose EBD from original figure panels'
          git push origin HEAD:master
