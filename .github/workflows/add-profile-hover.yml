name: Add mosaic profile hover

on:
  push:
    paths:
      - '.github/workflows/add-profile-hover.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add hover image and effect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/meterdogan07/meterdogan07.github.io/2a22f5b3e418978fcc58365fc562f1d643a72e5d/images/profile-mosaic-hover.jpg' \
            -o images/profile-mosaic-hover.jpg

          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text()

          old_css = '.hero img.profile{width:88%;max-width:270px;border-radius:4px;display:block;margin:auto}'
          new_css = '''.photo-swap{position:relative;width:88%;max-width:270px;aspect-ratio:1/1;margin:auto}\n    .photo-swap img.profile{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px;display:block;transition:opacity .28s ease}\n    .photo-swap .profile-mosaic{opacity:0}\n    @media (hover:hover) and (pointer:fine){.photo-swap:hover .profile-original{opacity:0}.photo-swap:hover .profile-mosaic{opacity:1}}'''
          if old_css not in s:
              raise SystemExit('Expected profile CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_mobile = '.hero img.profile{max-width:210px}'
          new_mobile = '.photo-swap{max-width:210px}'
          if old_mobile not in s:
              raise SystemExit('Expected mobile profile CSS not found')
          s = s.replace(old_mobile, new_mobile, 1)

          old_html = '<div class="photo"><img class="profile" src="https://raw.githubusercontent.com/meterdogan07/meterdogan07.github.io/master/images/1719327591661x.jpg" alt="Mete Erdogan"></div>'
          new_html = '''<div class="photo">\n      <div class="photo-swap">\n        <img class="profile profile-original" src="https://raw.githubusercontent.com/meterdogan07/meterdogan07.github.io/master/images/1719327591661x.jpg" alt="Mete Erdogan">\n        <img class="profile profile-mosaic" src="https://raw.githubusercontent.com/meterdogan07/meterdogan07.github.io/master/images/profile-mosaic-hover.jpg" alt="Mosaic portrait of Mete Erdogan">\n      </div>\n    </div>'''
          if old_html not in s:
              raise SystemExit('Expected profile HTML not found')
          s = s.replace(old_html, new_html, 1)
          p.write_text(s)
          PY

          rm .github/workflows/add-profile-hover.yml

      - name: Commit hover effect
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/index.html images/profile-mosaic-hover.jpg .github/workflows/add-profile-hover.yml
          git commit -m 'Add mosaic hover effect to profile photo'
          git push origin HEAD:master
